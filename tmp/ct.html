<!doctype html><meta charset="utf-8"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
window.rodar=async()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const buf=await (await fetch('ct.pdf?x='+Date.now())).arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; const C={pags:[],pos:[],sig:[{papel:'Funcionária'},{papel:'Empresa'},{papel:'Testemunha 1'},{papel:'Testemunha 2'}]};
for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),vp0=pg.getViewport({scale:1});const tc=await pg.getTextContent();C.pags.push({W:vp0.width,H:vp0.height,itens:tc.items.map(t=>({s:String(t.str||''),x:t.transform[4],y:t.transform[5],w:t.width||0,h:Math.abs(t.transform[3])||10}))});}
const desenharPos=()=>{}, toast=(m)=>{C.toast=m};
    function autoPos() {
      if (!C.pags.length) return;
      const reg = { 'Funcionária': /^(\(?A\)?\s*)?(EMPREGAD[OA](\(A\))?|CONTRATAD[OA](\(A\))?|FUNCION[ÁA]RI[OA]|COLABORADOR(A)?|TRABALHADOR(A)?)\b/i, 'Empresa': /^(EMPREGADOR(A)?|CONTRATANTE|EMPRESA|AMORATA|S\.?\s*LOBEU|T\s*A\s*T|REPRESENTANTE)/i, 'Testemunha': /^TESTEMUNHA/i };
      const ach = { 'Funcionária': [], 'Empresa': [], 'Testemunha': [] };
      C.pags.forEach((p, pi) => {
        const und = p.itens.filter((t) => /_{6,}/.test(t.s));
        p.itens.forEach((t) => { const tx = t.s.trim(); if (!tx || tx.length > 60 || /:\s*$/.test(tx)) return;
          Object.keys(reg).forEach((k) => { if (!reg[k].test(tx)) return; if (k === 'Funcionária' && /EMPREGADOR|CONTRATANTE/i.test(tx)) return;
            const cx = t.x + t.w / 2, l = und.filter((u2) => u2.y > t.y && u2.y - t.y < 45 && cx >= u2.x - 20 && cx <= u2.x + u2.w + 20).sort((a, b2) => a.y - b2.y)[0];
            ach[k].push({ page: pi, cx: cx / p.W * 100, baseY: ((l ? l.y : t.y + t.h) + 2) / p.H * 100, temLinha: !!l, y: t.y }); }); });
      });
      // se houver rótulos com linha de assinatura, usa só esses (evita pegar a qualificação no começo do contrato)
      Object.keys(ach).forEach((k) => { if (ach[k].some((a) => a.temLinha)) ach[k] = ach[k].filter((a) => a.temLinha); else { const ult = Math.max(-1, ...ach[k].map((a) => a.page)); ach[k] = ach[k].filter((a) => a.page === ult); } });
      C.pos = []; const box = (s, a) => ({ s: s, page: a.page, left: Math.max(0, Math.min(100 - 19.55, a.cx - 9.77)), bottom: Math.max(0, Math.min(100 - 9.42, a.baseY)), w: 19.55, h: 9.42 });
      C.sig.forEach((x, i) => { if (/^Testemunha/.test(x.papel)) { const n = Number(x.papel.slice(-1)) - 1; const porPag = {}; ach.Testemunha.sort((a, b2) => a.page - b2.page || b2.y - a.y || a.cx - b2.cx).forEach((a) => { (porPag[a.page] = porPag[a.page] || []).push(a); }); Object.keys(porPag).forEach((pg) => { const a = porPag[pg][n]; if (a) C.pos.push(box(i, a)); }); }
        else (ach[x.papel] || []).forEach((a) => C.pos.push(box(i, a))); });
      desenharPos();
      const falta = C.sig.filter((x, i) => !C.pos.some((p) => p.s === i)).map((x) => x.papel);
      if (falta.length) toast('Não achei no documento o campo de: ' + falta.join(', ') + '. Toque no nome e depois no lugar da assinatura.');
    }

autoPos(); return JSON.stringify({pos:C.pos.map(p=>[p.s,p.page,+p.left.toFixed(1),+p.bottom.toFixed(1)]),toast:C.toast||''}); };
</script>
